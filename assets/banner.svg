<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1512"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262d" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .pulse { animation: pulseOp 2.6s ease-in-out infinite; }
    .pulse-slow { animation: pulseOp 4s ease-in-out infinite; }
    .flow { stroke-dasharray: 8 6; animation: dash 12s linear infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulseOp { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.35; } }
    @keyframes dash { to { stroke-dashoffset: -140; } }
  </style>

  <!-- Outer Frame -->
  <rect width="1200" height="320" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>

  <!-- Decorative Cloud / Node Topology Lines (Right Side) -->
  <g opacity="0.32">
    <path d="M 880 70 L 980 120 L 1110 85 L 1140 195 L 1010 230 L 880 180 Z" fill="none" stroke="#3fb950" stroke-width="1.2" class="flow"/>
    <path d="M 980 120 L 1010 230 M 880 180 L 1110 85" fill="none" stroke="#58a6ff" stroke-width="1" class="flow"/>
    <circle cx="880" cy="70" r="4" fill="#3fb950" class="pulse"/>
    <circle cx="980" cy="120" r="5" fill="#58a6ff"/>
    <circle cx="1110" cy="85" r="4" fill="#bc8cff" class="pulse-slow"/>
    <circle cx="1140" cy="195" r="4" fill="#3fb950"/>
    <circle cx="1010" cy="230" r="5" fill="#3fb950" class="pulse"/>
    <circle cx="880" cy="180" r="3.5" fill="#d29922"/>
  </g>

  <!-- Terminal Top Bar -->
  <path d="M 1.5 14 A 12.5 12.5 0 0 1 14 1.5 L 1186 1.5 A 12.5 12.5 0 0 1 1198.5 14 L 1198.5 42 L 1.5 42 Z" fill="#161b22"/>
  <line x1="1" y1="42" x2="1199" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>

  <!-- Terminal Tab Title -->
  <text x="600" y="26" text-anchor="middle" fill="#8b949e" font-size="12.5" class="mono">
    fouad@aws-green-cloud: ~/portfolio/README.md (zsh — 120x32)
  </text>

  <!-- Right Top Region Tag -->
  <rect x="1045" y="10" width="136" height="22" rx="11" fill="#0d1117" stroke="#238636" stroke-width="1"/>
  <circle cx="1059" cy="21" r="3.5" fill="#3fb950" class="pulse"/>
  <text x="1070" y="25" fill="#3fb950" font-size="11" font-weight="600" class="mono">SAA-C03 ACTIVE</text>

  <!-- Command Prompt Line -->
  <text x="48" y="82" fill="#3fb950" font-size="14" font-weight="700" class="mono">fouad@cloud-arch</text>
  <text x="182" y="82" fill="#8b949e" font-size="14" class="mono">:</text>
  <text x="192" y="82" fill="#58a6ff" font-size="14" font-weight="700" class="mono">~/systems</text>
  <text x="272" y="82" fill="#e6edf3" font-size="14" class="mono">$ ./init-profile.sh --mode=production --carbon-aware</text>
  <rect x="698" y="69" width="8" height="16" fill="#3fb950" class="cursor"/>

  <!-- Main Name Heading -->
  <text x="48" y="148" fill="url(#titleGrad)" font-size="52" font-weight="800" letter-spacing="1.5" class="sans">
    FOUAD AWAD
  </text>

  <!-- Role & Focus Subtitle -->
  <text x="48" y="186" fill="#58a6ff" font-size="19" font-weight="600" class="mono">
    Cloud &amp; DevOps Engineer
  </text>
  <text x="315" y="186" fill="#484f58" font-size="19" class="mono">/</text>
  <text x="335" y="186" fill="#3fb950" font-size="19" font-weight="600" class="mono">
    Sustainable Cloud Systems
  </text>
  <text x="625" y="186" fill="#484f58" font-size="19" class="mono">/</text>
  <text x="645" y="186" fill="#bc8cff" font-size="19" font-weight="600" class="mono">
    Game Dev &amp; Creative Tech
  </text>

  <!-- Bio / Tagline -->
  <text x="48" y="222" fill="#8b949e" font-size="14.5" class="sans">
    Architecting resilient Multi-AZ AWS infrastructure, carbon-aware batch schedulers, and high-performance interactive experiences.
  </text>

  <!-- Bottom Pill Badges -->
  <!-- Badge 1: AWS Certified -->
  <g transform="translate(48, 250)">
    <rect width="278" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#ff9900"/>
    <text x="28" y="20.5" fill="#e6edf3" font-size="12" font-weight="600" class="mono">AWS Solutions Architect (SAA-C03)</text>
  </g>

  <!-- Badge 2: Capstone -->
  <g transform="translate(338, 250)">
    <rect width="318" height="32" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#3fb950" class="pulse"/>
    <text x="28" y="20.5" fill="#3fb950" font-size="12" font-weight="600" class="mono">Capstone: Carbon-Aware Cloud Scheduler</text>
  </g>

  <!-- Badge 3: Game Dev & Creatives -->
  <g transform="translate(668, 250)">
    <rect width="248" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#bc8cff"/>
    <text x="28" y="20.5" fill="#d2a8ff" font-size="12" font-weight="600" class="mono">Game Dev · Web · Indie Music</text>
  </g>

  <!-- Badge 4: Location -->
  <g transform="translate(928, 250)">
    <rect width="224" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#58a6ff"/>
    <text x="28" y="20.5" fill="#8b949e" font-size="12" font-weight="600" class="mono">Giza, EG (Open to Relocate)</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="14" y="316" width="1172" height="2.5" rx="1.25" fill="url(#accentGrad)"/>
</svg>
