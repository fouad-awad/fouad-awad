    <!-- User@Host Header -->
    <text x="0" y="16">
      <tspan fill="#3fb950" font-weight="700">fouad-awad</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#58a6ff" font-weight="700">aws-cloud-engine</tspan>
    </text>
    <text x="0" y="34" class="dim">────────────────────────────────────────────────────────────────────────────────</text>

    <text x="0" y="58">
      <tspan class="key">Role        </tspan><tspan class="dim">:: </tspan><tspan class="val">Cloud &amp; DevOps Engineer · Full-Stack &amp; Creative Developer</tspan>
    </text>
    <text x="0" y="82">
      <tspan class="key">Certs       </tspan><tspan class="dim">:: </tspan><tspan class="hi-orange">AWS Certified Solutions Architect – Associate (SAA-C03)</tspan>
    </text>
    <text x="0" y="106">
      <tspan class="key">Badges      </tspan><tspan class="dim">:: </tspan><tspan class="val">AWS Well-Architected Proficient · Claude on Amazon Bedrock</tspan>
    </text>
    <text x="0" y="130">
      <tspan class="key">Education   </tspan><tspan class="dim">:: </tspan><tspan class="val">B.Sc. Computer Engineering @ IAEMS (GPA 3.4 · </tspan><tspan class="hi-green">Ranked 3rd</tspan><tspan class="val"> · Jan 2027)</tspan>
    </text>
    <text x="0" y="154">
      <tspan class="key">Capstone    </tspan><tspan class="dim">:: </tspan><tspan class="hi-green">Carbon &amp; Cost-Aware Multi-Cloud Batch Job Scheduler</tspan>
    </text>
    <text x="0" y="178">
      <tspan class="key">Cloud &amp; IaC </tspan><tspan class="dim">:: </tspan><tspan class="val">AWS (EC2, VPC, RDS, Batch, CloudFront, WAF, Bedrock), Terraform, CFN</tspan>
    </text>
    <text x="0" y="202">
      <tspan class="key">DevOps &amp; DB </tspan><tspan class="dim">:: </tspan><tspan class="val">Docker, Kubernetes, GitHub Actions CI/CD, Linux, PostgreSQL, MySQL</tspan>
    </text>
    <text x="0" y="226">
      <tspan class="key">Code &amp; Web  </tspan><tspan class="dim">:: </tspan><tspan class="val">Python, Bash, C/C++, JavaScript, React, Node.js, Core Web Vitals</tspan>
    </text>
    <text x="0" y="250">
      <tspan class="key">Creatives   </tspan><tspan class="dim">:: </tspan><tspan class="hi-purple">Game Dev (Godot / Minecraft Mods) · Interactive Web · Indie/Rock Guitar</tspan>
    </text>
    <text x="0" y="274">
      <tspan class="key">Languages   </tspan><tspan class="dim">:: </tspan><tspan class="val">Arabic (Native/C2) · English (Advanced/C1) · German (Intermediate/B1)</tspan>
    </text>
    <text x="0" y="298">
      <tspan class="key">Contact     </tspan><tspan class="dim">:: </tspan><tspan class="val">fouadawad.org · fouad.ai@outlook.com · linkedin.com/in/fouad-awad</tspan>
    </text>

    <!-- Terminal Color Palette Swatches -->
    <g transform="translate(0, 316)">
      <rect x="0" y="0" width="22" height="12" rx="3" fill="#21262d"/>
      <rect x="28" y="0" width="22" height="12" rx="3" fill="#ff5f56"/>
      <rect x="56" y="0" width="22" height="12" rx="3" fill="#3fb950"/>
      <rect x="84" y="0" width="22" height="12" rx="3" fill="#ff9900"/>
      <rect x="112" y="0" width="22" height="12" rx="3" fill="#58a6ff"/>
      <rect x="140" y="0" width="22" height="12" rx="3" fill="#bc8cff"/>
      <rect x="168" y="0" width="22" height="12" rx="3" fill="#39c5cf"/>
      <rect x="196" y="0" width="22" height="12" rx="3" fill="#e6edf3"/>
    </g>

    <!-- Interactive Prompt at Bottom -->
    <text x="0" y="352">
      <tspan fill="#3fb950" font-weight="700">fouad@aws-cloud-engine</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#e6edf3">$ ./schedule-batch --carbon-intensity=low --sla=strict </tspan>
    </text>
    <rect x="585" y="339" width="8" height="15" fill="#3fb950" class="cursor"/>
  </g>
</svg>
