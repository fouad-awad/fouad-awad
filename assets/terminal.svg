<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 13px; }
    .key { fill: #58a6ff; font-weight: 700; }
    .val { fill: #c9d1d9; }
    .hi-green { fill: #3fb950; font-weight: 600; }
    .hi-orange { fill: #ff9900; font-weight: 600; }
    .hi-purple { fill: #d2a8ff; font-weight: 600; }
    .dim { fill: #8b949e; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Terminal Window Frame -->
  <rect width="1000" height="440" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header Bar -->
  <path d="M 1.5 12 A 10.5 10.5 0 0 1 12 1.5 L 988 1.5 A 10.5 10.5 0 0 1 998.5 12 L 998.5 38 L 1.5 38 Z" fill="#161b22"/>
  <line x1="1" y1="38" x2="999" y2="38" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="20" r="5.5" fill="#27c93f"/>
  <text x="500" y="24" text-anchor="middle" class="mono dim">fastfetch — fouad@aws-cloud-node</text>

  <!-- Left Column: ASCII / Vector Cloud & Terminal Art -->
  <g transform="translate(32, 68)" class="mono" fill="url(#asciiGrad)" font-weight="700" xml:space="preserve">
    <text x="0" y="20">          .---.          </text>
    <text x="0" y="40">       .-(     )-.       </text>
    <text x="0" y="60">    .-(   GREEN   )-.    </text>
    <text x="0" y="80">   (   CLOUD  NODE   )   </text>
    <text x="0" y="100">    '-.___________.-'    </text>
    <text x="0" y="122" fill="#58a6ff">      |   |   |   |      </text>
    <text x="0" y="142" fill="#3fb950">    [AZ1] [AZ2] [AZ3]    </text>
    <text x="0" y="164" fill="#8b949e">   ┌─────────────────┐   </text>
    <text x="0" y="184" fill="#8b949e">   │  $ iac --deploy │   </text>
    <text x="0" y="204" fill="#8b949e">   │  &gt; CO2: OPTIMAL │   </text>
    <text x="0" y="224" fill="#8b949e">   │  &gt; SLA: 99.99%  │   </text>
    <text x="0" y="244" fill="#8b949e">   └─────────────────┘   </text>
  </g>

  <!-- Mini Status Box under ASCII art -->
  <g transform="translate(38, 336)">
    <rect width="195" height="68" rx="8" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <text x="14" y="22" class="mono hi-green" font-size="11.5">● SYSTEM STATUS: ONLINE</text>
    <text x="14" y="41" class="mono dim" font-size="11">Load: -45% Latency</text>
    <text x="14" y="57" class="mono dim" font-size="11">Carbon Policy: Active</text>
  </g>

